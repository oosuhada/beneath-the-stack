name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install formatting tool
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Build with warnings as errors
        run: make -j2 all CXX=g++

      - name: Deterministic tests
        run: make test CXX=g++

      - name: Syntax and whitespace lint
        run: make lint CXX=g++

      - name: Formatting check
        run: clang-format --dry-run --Werror $(find include labs tests -name '*.hpp' -o -name '*.cpp')

      - name: Quick experiment smoke test
        run: |
          python3 tools/run_labs.py --profile quick \
            --output /tmp/beneath-the-stack-evidence.json \
            --csv-output /tmp/beneath-the-stack-evidence.csv > /dev/null

      - name: Validate evidence shape
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/beneath-the-stack-evidence.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema_version'] == 2
          assert len(payload['labs']) == 19
          assert {lab['lab'] for lab in payload['labs']} == {
              'hash-table', 'heap-scheduler', 'graph-traversal',
              'concurrency-race', 'raw-http', 'db-index',
              'data-structures', 'algorithm-defense',
              'memory-locality', 'process-fd', 'os-boundary',
              'virtual-memory', 'scheduler-internals', 'storage-engine',
              'allocator', 'toy-filesystem', 'firmware-boundary',
              'embedded-simulator', 'durable-job-runtime'
          }
          assert payload['git_commit']
          assert payload['environment']['cxxflags']
          PY

          test -s /tmp/beneath-the-stack-evidence.csv

      - name: CMake portability check
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake -j2
          ctest --test-dir build-cmake --output-on-failure

